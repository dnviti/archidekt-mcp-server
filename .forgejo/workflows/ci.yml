name: ci

on:
  push:
    branches:
      - main
      - "agente/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run Ruff lint
        run: python -m ruff check src/archidekt_commander_mcp

      - name: Run mypy type-check
        run: python -m mypy src/archidekt_commander_mcp

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
